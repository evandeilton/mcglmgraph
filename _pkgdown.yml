url: https://evandeilton.github.io/mcglmgraph/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    bg: "#ffffff"
    fg: "#1e293b"
    primary: "#4f46e5"
    secondary: "#0d9488"
    link-color: "#4338ca"
    headings-color: "#0f172a"
    base_font: {google: "Inter"}
